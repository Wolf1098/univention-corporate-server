[Global]
jenkins_description: Delegated Administration performance test
logfile: autotest-delegated-administration-performance.log

kvm_server: [ENV:KVM_BUILD_SERVER]
kvm_user: [ENV:KVM_USER]
kvm_extra_label: [ENV:JOB_BASE_NAME]-[ENV:UCS_VERSION]
kvm_template: [ENV:KVM_TEMPLATE]
kvm_ucsversion: [ENV:UCS_VERSION]
kvm_vcpus: 4
kvm_memory: 32GiB
kvm_dhcp: true

recover: 6

# Openstack settings
# beefy!
openstack_flavor_name: UNIVENTION-8V-32-100s

environment:
 UCS_VERSION=[ENV:UCS_VERSION]
 UCS_TEST_RUN=[ENV:UCS_TEST_RUN]
 RELEASE_UPDATE=[ENV:RELEASE_UPDATE]
 ERRATA_UPDATE=[ENV:ERRATA_UPDATE]
 TARGET_VERSION=[ENV:TARGET_VERSION]
 JENKINS_WS=[ENV:JOB_URL]
 APPVERSION=[ENV:APPVERSION]
 KEYCLOAK_BRANCH=[ENV:KEYCLOAK_BRANCH]
 SCOPE=[ENV:SCOPE]
 BASE_SCOPE=ucs-dev/delegated-administration
 LOCUST_SPAWN_RATE=[ENV:LOCUST_SPAWN_RATE]
 LOCUST_RUN_TIME=[ENV:LOCUST_RUN_TIME]
 LOCUST_USERS=[ENV:LOCUST_USERS]
 LOCUST_THROUGHPUT=[ENV:LOCUST_THROUGHPUT]
 USE_PERFORMANCE_TREND=[ENV:USE_PERFORMANCE_TREND]

[primary]
kvm_operating_system: Others
kvm_template: ucs-primary-with-200000-users
openstack_image_name: [ENV:OPENSTACK_IMAGE_VERSION]-dev-performance-20.000-primary
command1:
 . utils.sh && basic_setup
 . utils.sh && basic_setup_ucs_joined [SELF_IP]
 . utils.sh && import_license 10000
 . utils.sh && add_tech_key_authorized_keys
command2:
 . utils.sh && add_extra_apt_scope
 . utils.sh && jenkins_updates
 . utils.sh && do_reboot
 LOCAL sleep 120
 . utils.sh && wait_for_reboot
 udm computers/memberserver remove --remove_referring --dn "cn=member,cn=memberserver,cn=computers,$(ucr get ldap/base)"
 udm computers/domaincontroller_slave remove --remove_referring --dn "cn=slave,cn=dc,cn=computers,$(ucr get ldap/base)"
 udm computers/domaincontroller_backup remove --remove_referring --dn "cn=backup,cn=dc,cn=computers,$(ucr get ldap/base)"
command3:
 . utils.sh && assert_join
 . utils.sh && assert_version "[ENV:TARGET_VERSION]"
 . utils-keycloak.sh && install_upgrade_keycloak
 . utils.sh && configure_umc_keycloak
 echo "univention" > /tmp/pwdfile
 # make guardian installable in 5.2
 univention-app dev-set "guardian-authorization-api" "SupportedUcsVersions=5.2-0"
 univention-app dev-set "guardian-management-ui" "SupportedUcsVersions=5.2-0"
 univention-app dev-set "guardian-management-api" "SupportedUcsVersions=5.2-0"
 ucr set directory/manager/web/delegative-administration/enabled=false
 ucr set directory/manager/rest/delegative-administration/enabled=false
 service univention-directory-manager-rest restart
 # install guardian
 udm users/user modify  --dn "uid=Administrator,cn=users,$(ucr get ldap/base)" --append guardianRoles=guardian:builtin:super-admin
 univention-app install --username=Administrator --pwdfile=/tmp/pwdfile --skip --noninteractive guardian-management-api guardian-authorization-api guardian-management-ui
 # setup
 . utils-delegated-administration.sh && guardian_configuration
 . utils-delegated-administration.sh && guardian_service_client
 . utils-delegated-administration.sh && guardian_check_permissions
 . utils-keycloak.sh && keycloak_saml_idp_setup
 . utils-keycloak.sh && keycloak_umc_oidc_idp_setup
 . utils.sh && umc_performance_settings
command4:
 . utils.sh && assert_join
 . utils.sh && configure_umc_postgres
 service univention-management-console-server restart
command5:
 # install tests
 ASYNC . utils.sh && install_from_errata_test ucs-test
 /usr/share/ucs-test/42_authorization/create-delegated-administration-setup.py
command6:
 . utils.sh && prepare_results
 LOCAL utils/utils-local.sh fetch-results [SELF_IP] [SELF]
files:
 ~/ec2/scripts/activate-errata-test-scope.sh /root/
 ~/ec2/license/license.secret /etc/

[backup]
kvm_operating_system: Others
kvm_template: ucs-backup1-with-200000-users
openstack_image_name: [ENV:OPENSTACK_IMAGE_VERSION]-dev-performance-20.000-backup
command1:
 . utils.sh && basic_setup
 . utils.sh && basic_setup_ucs_joined [primary_IP]
 . utils.sh && add_tech_key_authorized_keys
command2:
 . utils.sh && add_extra_apt_scope
 . utils.sh && jenkins_updates
command3:
 . utils.sh && assert_join
 . utils.sh && assert_version "[ENV:TARGET_VERSION]"
 . utils.sh && switch_to_test_app_center || :
 . utils-keycloak.sh && install_upgrade_keycloak
 . utils-keycloak.sh && keycloak_saml_idp_setup
 . utils-keycloak.sh && keycloak_umc_oidc_idp_setup
 . utils.sh && umc_performance_settings
 . utils.sh && assert_join
 service univention-management-console-server restart
command4:
 # tests
command5:
 . utils.sh && prepare_results
 LOCAL utils/utils-local.sh fetch-results [SELF_IP] [SELF]
files:
 ~/ec2/scripts/activate-errata-test-scope.sh /root/

[locust]
openstack_image_name: [ENV:OPENSTACK_IMAGE_VERSION]-dev-performance-20.000-managed
command1:
 . utils.sh && basic_setup
 . utils.sh && basic_setup_ucs_joined [primary_IP]
 . utils.sh && add_tech_key_authorized_keys
command2:
 . utils.sh && add_extra_apt_scope
 . utils.sh && jenkins_updates
command3:
 . utils.sh && assert_join
 . utils.sh && assert_version "[ENV:TARGET_VERSION]"
command4:
 # tests
 . utils.sh && install_ucs_test
 cd /usr/share/ucs-test/92_udm-rest-performance
 echo "Running benchmark with delegative administration DISABLED"
 ./run_all_tests.sh
 # Move results to separate directory
 mkdir -p results_disabled
 cp results/*.{html,csv,log} results_disabled/ || true
 # Enable delegative administration
 echo "Enabling delegative administration and restarting service"
 ucr set directory/manager/rest/delegative-administration/enabled=true
 ucr set directory/manager/web/delegative-administration/enabled=true
 systemctl restart univention-directory-manager-rest.service univention-management-console-server.service
 # Wait for service to be ready
 sleep 30
 echo "Running benchmark with delegative administration ENABLED"
 ./run_all_tests.sh
 # Move results to separate directory
 mkdir -p results_enabled
 cp results/*.{html,csv,log} results_enabled/ || true
command5:
 . utils.sh && prepare_results
 if [ENV:USE_PERFORMANCE_TREND]; then mkdir -p /root/locust_disabled /root/locust_enabled /root/jmeter_disabled /root/jmeter_enabled; fi
 if [ENV:USE_PERFORMANCE_TREND]; then cp /usr/share/ucs-test/92_udm-rest-performance/results_disabled/*.{html,csv,log} /root/locust_disabled/ || true; fi
 if [ENV:USE_PERFORMANCE_TREND]; then cp /usr/share/ucs-test/92_udm-rest-performance/results_enabled/*.{html,csv,log} /root/locust_enabled/ || true; fi
 if [ENV:USE_PERFORMANCE_TREND]; then cp /usr/share/ucs-test/92_udm-rest-performance/results_disabled/jmeter_results_*.csv /root/jmeter_disabled/ || true; fi
 if [ENV:USE_PERFORMANCE_TREND]; then cp /usr/share/ucs-test/92_udm-rest-performance/results_enabled/jmeter_results_*.csv /root/jmeter_enabled/ || true; fi
 LOCAL if [ENV:USE_PERFORMANCE_TREND]; then utils/utils-local.sh fetch-files "root@[SELF_IP]" '/root/jmeter_disabled' .; fi
 LOCAL if [ENV:USE_PERFORMANCE_TREND]; then utils/utils-local.sh fetch-files "root@[SELF_IP]" '/root/jmeter_enabled' .; fi
 LOCAL if [ENV:USE_PERFORMANCE_TREND]; then utils/utils-local.sh fetch-files "root@[SELF_IP]" '/root/locust_disabled' .; fi
 LOCAL if [ENV:USE_PERFORMANCE_TREND]; then utils/utils-local.sh fetch-files "root@[SELF_IP]" '/root/locust_enabled' .; fi
 LOCAL utils/utils-local.sh fetch-results [SELF_IP] [SELF]
files:
 ~/ec2/scripts/activate-errata-test-scope.sh /root/
